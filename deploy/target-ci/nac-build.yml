# Workflow para o REPOSITÓRIO ALVO (copie para .github/workflows/nac-build.yml no branch padrão).
#
# O new-app-chaos dispara este workflow para construir a imagem de uma versão: o commit que
# rodou no teste (A) e o branch de uma correção (B). A imagem vai para o GHCR do próprio
# repositório. As credenciais de build e de registry são as deste workflow; o new-app-chaos e o
# agente que edita código nunca as veem.
#
# Requisitos:
#   - um Dockerfile no repositório (ajuste DOCKERFILE abaixo);
#   - o PR_GITHUB_TOKEN do new-app-chaos com a permissão Actions (leitura e escrita) neste repositório;
#   - o cluster conseguir baixar ghcr.io/<dono>/<repo>: pacote público, ou um Secret de pull.
name: nac-build
# O new-app-chaos acha a execução por este título: não mude.
run-name: nac-build ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou branch a construir
        required: true
      tag:
        description: Tag da imagem
        required: true

permissions:
  contents: read
  packages: write

env:
  DOCKERFILE: Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
          # O commit vai no rótulo da imagem; o new-app-chaos registra em cada execução.
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
