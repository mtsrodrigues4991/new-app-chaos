# Imagens construídas localmente e carregadas no KIND (kind load docker-image).
backend:
  image: new-app-chaos-backend:dev
  pullPolicy: IfNotPresent
  # Imagem do k6 usada nos Jobs de carga.
  k6Image: grafana/k6:0.54.0  # mesma versão do modo Docker (runner.DefaultK6Image)
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Banco SQLite (cenários, execuções, métricas).
  storage:
    size: 1Gi
    storageClass: ""   # vazio = padrão do cluster (no KIND, "standard")

frontend:
  image: new-app-chaos-frontend:dev
  pullPolicy: IfNotPresent
  # Porta do nó; o KIND mapeia para localhost:3000 (deploy/kind/cluster.yaml).
  nodePort: 30080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Stack de observabilidade (OBS=1 no scripts/kind-up.sh). Com enabled, o backend lê, no fim
# de cada execução no Kubernetes, as métricas da aplicação (Prometheus), os traces lentos e
# com erro (Tempo) e o profiling (Pyroscope) dos alvos, e manda para a IA.
observability:
  enabled: false
  prometheusUrl: http://lgtm.observability:9090
  tempoUrl: http://lgtm.observability:3200
  pyroscopeUrl: http://lgtm.observability:4040
  # Endereço do Grafana no seu navegador (para os botões da tela); vazio = sem botão.
  # /grafana é o próprio app: o backend repassa para grafanaProxyUrl (sem port-forward).
  grafanaUrl: /grafana
  grafanaProxyUrl: http://lgtm.observability:3000

# Secret com ANTHROPIC_API_KEY e GITHUB_TOKEN (opcionais). O scripts/kind-up.sh cria a
# partir do .env; o chart só referencia, para a chave nunca passar pelo values.
secretName: new-app-chaos-secrets

# Muda a cada make kind-up para os pods pegarem a imagem recém-carregada (mesma tag).
buildId: ""
