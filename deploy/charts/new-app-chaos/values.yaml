# Imagens construídas localmente e carregadas no KIND (kind load docker-image).
backend:
  image: new-app-chaos-backend:dev
  pullPolicy: IfNotPresent
  # Imagem do k6 usada nos Jobs de carga.
  k6Image: grafana/k6:0.54.0  # mesma versão do modo Docker (runner.DefaultK6Image)
  # Onde os Jobs do k6 rodam (vazio = qualquer nó). Na AKS: o pool "load" (spot), ex.:
  # k6NodeSelector: agentpool=load
  # k6Tolerations: kubernetes.azure.com/scalesetpriority=spot:NoSchedule
  k6NodeSelector: ""
  k6Tolerations: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Banco SQLite (cenários, execuções, métricas).
  storage:
    size: 1Gi
    storageClass: ""   # vazio = padrão do cluster (no KIND, "standard")

frontend:
  image: new-app-chaos-frontend:dev
  pullPolicy: IfNotPresent
  # NodePort no KIND (o KIND mapeia para localhost:3000, deploy/kind/cluster.yaml);
  # ClusterIP na nuvem, onde a entrada é o Ingress.
  serviceType: NodePort
  nodePort: 30080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Stack de observabilidade (OBS=1 no scripts/kind-up.sh). Com enabled, o backend lê, no fim
# de cada execução no Kubernetes, as métricas da aplicação (Prometheus), os traces lentos e
# com erro (Tempo) e o profiling (Pyroscope) dos alvos, e manda para a IA.
observability:
  enabled: false
  prometheusUrl: http://lgtm.observability:9090
  tempoUrl: http://lgtm.observability:3200
  pyroscopeUrl: http://lgtm.observability:4040
  # Endereço do Grafana no seu navegador (para os botões da tela); vazio = sem botão.
  # /grafana é o próprio app: o backend repassa para grafanaProxyUrl (sem port-forward).
  grafanaUrl: /grafana
  grafanaProxyUrl: http://lgtm.observability:3000

# Permissões do backend no cluster.
# targetNamespaces vazio: um ClusterRole deixa criar falhas do Chaos Mesh em qualquer namespace
# (o comportamento de sempre; serve para o KIND local).
# Com uma lista (ex.: [demo, pix, dorigao]): o ClusterRole fica só de leitura, e criar falhas e
# ler logs passa a valer só nesses namespaces, por Role + RoleBinding em cada um. Os namespaces
# precisam existir antes do helm install. Use junto com guard.allowedTargetNamespaces.
rbac:
  targetNamespaces: []

# Correções automáticas (Fase 2 da docs/analise-evolucao.md): com enabled, o chart cria o namespace
# do sandbox, e uma correção sugerida pela IA e aprovada por uma pessoa pode virar um PR em
# rascunho. Precisa da ANTHROPIC_API_KEY e do PR_GITHUB_TOKEN no secretName, e de um cluster que
# aplique NetworkPolicy (ver templates/sandbox.yaml).
sandbox:
  enabled: false
  namespace: ""   # vazio = <namespace do app>-sandbox
  image: new-app-chaos-agent:dev   # deploy/sandbox

# Endereço público do app, para o PR apontar para a execução que o motivou (vazio = sem link).
appUrl: ""

# Secret com ANTHROPIC_API_KEY e GITHUB_TOKEN (opcionais). O scripts/kind-up.sh cria a
# partir do .env; o chart só referencia, para a chave nunca passar pelo values.
secretName: new-app-chaos-secrets

# Muda a cada make kind-up para os pods pegarem a imagem recém-carregada (mesma tag).
buildId: ""

# Entrada pública (nuvem): Ingress com HTTPS na frente do frontend.
ingress:
  enabled: false
  className: traefik
  host: ""
  # Secret com o certificado (o cert-manager cria; o workflow guarda uma cópia ao desligar).
  tlsSecret: new-app-chaos-tls
  annotations: {}

# Login (nuvem). A senha do admin e os convidados fixos (APP_USERS) vêm do secretName.
auth:
  enabled: false
  adminUser: admin
  secureCookie: true

# Travas para convidados (nuvem): URL base só de serviços do cluster, namespaces onde alvos e
# dependências podem estar e teto diário da IA. Os namespaces de sistema são negados sempre.
guard:
  allowedTargetHosts: ""   # ex.: demo,pix,dorigao
  allowedTargetNamespaces: ""   # ex.: demo,pix,dorigao (vazio = qualquer um que não seja de sistema)
  aiDailyLimit: 0          # 0 = sem limite
