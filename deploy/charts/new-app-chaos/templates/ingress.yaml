{{- if .Values.ingress.enabled }}
# Entrada pública: HTTPS no host da nuvem, tudo para o frontend (que repassa /api e /grafana).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-app-chaos
  labels: {{- include "nac.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.host é obrigatório" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
{{- end }}
