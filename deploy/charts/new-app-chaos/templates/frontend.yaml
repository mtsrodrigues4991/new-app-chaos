apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "nac.labels" . | nindent 4 }}
    app.kubernetes.io/name: new-app-chaos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: new-app-chaos-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: new-app-chaos-frontend
      annotations:
        new-app-chaos/build: {{ .Values.buildId | quote }}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "nac.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: new-app-chaos-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.frontend.nodePort }}
