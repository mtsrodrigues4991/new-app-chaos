{{- if .Values.ephemeral.enabled }}
{{- $ns := .Values.ephemeral.namespace | default (printf "%s-ephemeral" .Release.Namespace) }}
# Ambientes efêmeros: onde sobem as cópias A e B do alvo para o experimento de uma correção.
# O namespace é fixo (criá-los por experimento exigiria dar ao backend escrita em Deployments no
# cluster inteiro); cada experimento marca os seus objetos e os apaga no fim. O backend só
# escreve Deployments e Services aqui.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels: {{- include "nac.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Namespace }}-new-app-chaos-ephemeral
  namespace: {{ $ns }}
  labels: {{- include "nac.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  # As cópias são alvos como outros: logs e falhas valem aqui mesmo com rbac.targetNamespaces.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  {{- include "nac.chaosRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Namespace }}-new-app-chaos-ephemeral
  namespace: {{ $ns }}
  labels: {{- include "nac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-new-app-chaos-ephemeral
subjects:
  - kind: ServiceAccount
    name: new-app-chaos
    namespace: {{ .Release.Namespace }}
---
# Teto: duas cópias de um alvo, com folga para um experimento por vez.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: new-app-chaos-ephemeral
  namespace: {{ $ns }}
  labels: {{- include "nac.labels" . | nindent 4 }}
spec:
  hard:
    pods: "12"
{{- end }}
