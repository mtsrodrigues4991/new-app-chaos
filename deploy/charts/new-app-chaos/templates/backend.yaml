apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-app-chaos-data
  labels: {{- include "nac.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backend.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "nac.labels" . | nindent 4 }}
    app.kubernetes.io/name: new-app-chaos-backend
spec:
  replicas: 1
  # SQLite num volume RWO: nunca dois backends ao mesmo tempo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: new-app-chaos-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: new-app-chaos-backend
      annotations:
        new-app-chaos/build: {{ .Values.buildId | quote }}
    spec:
      serviceAccountName: new-app-chaos
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_PATH
              value: /data/app.db
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K6_IMAGE
              value: {{ .Values.backend.k6Image }}
            {{- if .Values.observability.enabled }}
            - { name: OBS_PROMETHEUS_URL, value: {{ .Values.observability.prometheusUrl | quote }} }
            - { name: OBS_TEMPO_URL, value: {{ .Values.observability.tempoUrl | quote }} }
            - { name: OBS_PYROSCOPE_URL, value: {{ .Values.observability.pyroscopeUrl | quote }} }
            - { name: OBS_GRAFANA_URL, value: {{ .Values.observability.grafanaUrl | quote }} }
            {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: GITHUB_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: new-app-chaos-data
---
# O nome "backend" é o mesmo do docker-compose: o nginx do frontend usa http://backend:8080.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {{- include "nac.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: new-app-chaos-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
