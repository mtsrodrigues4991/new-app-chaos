# Nome do Deployment e do Service (padrão: nome do release).
name: ""
image: ""
pullPolicy: IfNotPresent
replicas: 2
# Porta do container; o Service expõe a mesma.
port: 8080
# Variáveis de ambiente ([{name, value}]).
env: []
# Sonda de prontidão: path HTTP (ex.: /health) ou vazio para TCP na porta.
probe:
  path: ""
  initialDelaySeconds: 5
  periodSeconds: 5
# Volume de dados montado neste caminho; vazio = sem volume. As falhas de IO do Chaos Mesh
# (IOChaos) só atuam em volumes, então o banco precisa de um.
dataPath: ""
# Com persistence.enabled o volume é um PVC (sobrevive a um kill do pod); sem, é um emptyDir
# (some junto com o pod). storageClass vazio = a padrão do cluster (no KIND, "standard").
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
# Telemetria para a stack de observabilidade (OBS=1 no scripts/kind-up.sh).
otel:
  enabled: false
  # Coletor OTLP (http/protobuf) da stack grafana/otel-lgtm.
  endpoint: http://lgtm.observability:4318
  # Alvo Java: carrega o OpenTelemetry Java agent (métricas da JVM, HTTP, pool do banco,
  # traces) sem reconstruir a imagem. Os jars vêm de agentsImage por um initContainer.
  java: false
  # Com java: também o Pyroscope Java agent (profiling de CPU e alocação).
  profiling: false
  pyroscope: http://lgtm.observability:4040
  agentsImage: new-app-chaos-java-agents:dev
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
# Muda a cada make kind-up para os pods pegarem a imagem recém-carregada (mesma tag).
buildId: ""
