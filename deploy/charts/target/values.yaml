# Nome do Deployment e do Service (padrão: nome do release).
name: ""
image: ""
pullPolicy: IfNotPresent
replicas: 2
# Porta do container; o Service expõe a mesma.
port: 8080
# Variáveis de ambiente ([{name, value}]).
env: []
# Sonda de prontidão: path HTTP (ex.: /health) ou vazio para TCP na porta.
probe:
  path: ""
  initialDelaySeconds: 5
  periodSeconds: 5
# Volume de dados (emptyDir) montado neste caminho; vazio = sem volume. As falhas de IO do
# Chaos Mesh (IOChaos) só atuam em volumes, então o banco precisa de um.
dataPath: ""
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
# Muda a cada make kind-up para os pods pegarem a imagem recém-carregada (mesma tag).
buildId: ""
