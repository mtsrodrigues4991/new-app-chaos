{{- $name := .Values.name | default .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: new-app-chaos-targets
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      {{- with .Values.buildId }}
      annotations:
        new-app-chaos/build: {{ . | quote }}
      {{- end }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ required "image é obrigatório" .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
              name: app
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            {{- if .Values.probe.path }}
            httpGet:
              path: {{ .Values.probe.path }}
              port: app
            {{- else }}
            tcpSocket:
              port: app
            {{- end }}
            initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probe.periodSeconds }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: app
      port: {{ .Values.port }}
      targetPort: app
