{{- $name := .Values.name | default .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: new-app-chaos-targets
spec:
  replicas: {{ .Values.replicas }}
  {{- if and .Values.dataPath .Values.persistence.enabled }}
  # Um pod por vez no volume: o novo só sobe depois que o antigo sai (como um Recreate, sem
  # trocar o tipo da estratégia em quem já está instalado).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      {{- with .Values.buildId }}
      annotations:
        new-app-chaos/build: {{ . | quote }}
      {{- end }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ required "image é obrigatório" .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
              name: app
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            {{- if .Values.probe.path }}
            httpGet:
              path: {{ .Values.probe.path }}
              port: app
            {{- else }}
            tcpSocket:
              port: app
            {{- end }}
            initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probe.periodSeconds }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.dataPath }}
          volumeMounts:
            - name: data
              mountPath: {{ . }}
          {{- end }}
      {{- if .Values.dataPath }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
{{- if and .Values.dataPath .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: new-app-chaos-targets
  annotations:
    # Um helm uninstall não apaga os dados.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: app
      port: {{ .Values.port }}
      targetPort: app
