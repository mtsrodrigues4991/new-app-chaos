{{- $name := .Values.name | default .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: new-app-chaos-targets
spec:
  replicas: {{ .Values.replicas }}
  {{- if and .Values.dataPath .Values.persistence.enabled }}
  # Um pod por vez no volume: o novo só sobe depois que o antigo sai (como um Recreate, sem
  # trocar o tipo da estratégia em quem já está instalado).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      {{- with .Values.buildId }}
      annotations:
        new-app-chaos/build: {{ . | quote }}
      {{- end }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ required "image é obrigatório" .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
              name: app
          {{- if or .Values.env .Values.otel.enabled }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: OTEL_SDK_DISABLED, value: "false" }
            - { name: OTEL_SERVICE_NAME, value: {{ $name | quote }} }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace={{ .Release.Namespace }},k8s.namespace.name={{ .Release.Namespace }},k8s.pod.name=$(POD_NAME)" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            # Métricas a cada 5 s: a execução dura poucos minutos.
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "5000" }
            # Os logs já vêm do Kubernetes; o agente não precisa exportar.
            - { name: OTEL_LOGS_EXPORTER, value: none }
            {{- if .Values.otel.java }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel-agents/opentelemetry-javaagent.jar{{ if .Values.otel.profiling }} -javaagent:/otel-agents/pyroscope.jar{{ end }}"
            {{- if .Values.otel.profiling }}
            - { name: PYROSCOPE_APPLICATION_NAME, value: {{ $name | quote }} }
            - { name: PYROSCOPE_SERVER_ADDRESS, value: {{ .Values.otel.pyroscope | quote }} }
            - { name: PYROSCOPE_FORMAT, value: jfr }
            - { name: PYROSCOPE_PROFILER_EVENT, value: itimer }
            - { name: PYROSCOPE_PROFILER_ALLOC, value: 512k }
            - { name: PYROSCOPE_UPLOAD_INTERVAL, value: 10s }
            - { name: PYROSCOPE_LABELS, value: "service_namespace={{ .Release.Namespace }}" }
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          readinessProbe:
            {{- if .Values.probe.path }}
            httpGet:
              path: {{ .Values.probe.path }}
              port: app
            {{- else }}
            tcpSocket:
              port: app
            {{- end }}
            initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probe.periodSeconds }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- $agents := and .Values.otel.enabled .Values.otel.java }}
          {{- if or .Values.dataPath $agents }}
          volumeMounts:
            {{- with .Values.dataPath }}
            - name: data
              mountPath: {{ . }}
            {{- end }}
            {{- if $agents }}
            - name: otel-agents
              mountPath: /otel-agents
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if $agents }}
      initContainers:
        - name: otel-agents
          image: {{ .Values.otel.agentsImage }}
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "cp /agents/*.jar /otel-agents/"]
          volumeMounts:
            - name: otel-agents
              mountPath: /otel-agents
      {{- end }}
      {{- if or .Values.dataPath $agents }}
      volumes:
        {{- if $agents }}
        - name: otel-agents
          emptyDir: {}
        {{- end }}
        {{- if .Values.dataPath }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
{{- if and .Values.dataPath .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: new-app-chaos-targets
  annotations:
    # Um helm uninstall não apaga os dados.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: app
      port: {{ .Values.port }}
      targetPort: app
