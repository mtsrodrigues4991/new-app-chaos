server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8080;
    # Necessário para o stream ao vivo (Server-Sent Events) chegar sem atraso.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    # IP real do usuário para o limite de tentativas de login (atrás do Ingress).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Grafana da stack de observabilidade (OBS=1), repassado pelo backend.
  location /grafana/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;
  }

  location / { try_files $uri /index.html; }
}
